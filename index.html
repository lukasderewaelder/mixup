<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mixup</title>
  <meta name="description" content="Teams per Zufall für den Unterricht – offline, ohne Konto, alle Namen bleiben auf dem Gerät.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mixup">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/themes.css">
  <script>
    // Design vor dem ersten Zeichnen setzen (kein kurzes Aufblitzen des Standard-Designs)
    try {
      const t = JSON.parse(localStorage.getItem('mixup:v1') || '{}').settings?.theme;
      if (['poster', 'heft', 'akzent'].includes(t)) document.documentElement.dataset.theme = t;
    } catch { /* Standard-Design */ }
  </script>
  <link rel="stylesheet" href="css/print.css" media="print">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Mixup – zur Klassenübersicht">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="9" cy="9" r="6" fill="var(--team-1)"/>
        <circle cx="23" cy="9" r="6" fill="var(--team-2)"/>
        <circle cx="9" cy="23" r="6" fill="var(--team-3)"/>
        <circle cx="25" cy="25" r="6" fill="var(--team-4)"/>
      </svg>
      <span class="brand-word" translate="no">Mixup</span>
    </a>
    <nav class="topbar-actions" aria-label="App">
      <button type="button" class="icon-btn" id="help-btn" aria-label="Kurzanleitung" title="Kurzanleitung (?)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.4a2.6 2.6 0 0 1 5.1.6c0 1.8-2.6 2.3-2.6 4"/><path d="M12 17.2h.01"/></svg>
      </button>
      <a class="icon-btn" href="#/einstellungen" aria-label="Einstellungen" title="Einstellungen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </a>
    </nav>
  </header>

  <main id="main" class="page" tabindex="-1"></main>

  <noscript><p class="page">Mixup braucht JavaScript. Bitte im Browser aktivieren.</p></noscript>
</body>
</html>
